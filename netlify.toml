[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# www → apex 301 (canonical host = eplicant.com)
[[redirects]]
  from = "https://www.eplicant.com/*"
  to = "https://eplicant.com/:splat"
  status = 301
  force = true

# Article publishing webhook → edge function
[[redirects]]
  from = "/api/public/webhooks/publish-article"
  to = "https://wmfwpviizgvohgadumgp.supabase.co/functions/v1/publish-article"
  status = 200
  force = true

# External blog publishing endpoint → edge function (Bearer BLOG_PUBLISH_KEY)
[[redirects]]
  from = "/api/public/posts"
  to = "https://wmfwpviizgvohgadumgp.supabase.co/functions/v1/publish-post"
  status = 200
  force = true

# Edge functions (configured inside each file with `export const config`):
#   netlify/edge-functions/sitemap.ts → /sitemap.xml, /sitemap-pages.xml, /sitemap-jobs.xml, /sitemap-blog.xml
#   netlify/edge-functions/seo.ts     → every HTML page: head tags, 301/404/410 status, crawler HTML

# SPA fallback — serve index.html for all routes (seo.ts sets the real status code)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
