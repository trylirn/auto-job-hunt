<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eplicant — Find Your Next Opportunity</title>
    <meta name="description" content="Thousands of jobs from across the web, updated automatically. Search remote, full-time, and freelance opportunities worldwide.">
    <meta name="author" content="Eplicant" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="canonical" href="https://eplicant.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eplicant.com/" />
    <meta property="og:title" content="Eplicant — Find Your Next Opportunity">
    <meta property="og:description" content="Thousands of jobs from across the web, updated automatically. Search remote, full-time, and freelance opportunities worldwide.">
    <meta property="og:image" content="https://eplicant.com/logo.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eplicant — Find Your Next Opportunity">
    <meta name="twitter:description" content="Thousands of jobs from across the web, updated automatically. Search remote, full-time, and freelance opportunities worldwide.">
    <meta name="twitter:image" content="https://eplicant.com/logo.png">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8988791559344644" crossorigin="anonymous"></script>

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Eplicant",
      "url": "https://eplicant.com",
      "logo": "https://eplicant.com/logo.png",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Eplicant",
      "url": "https://eplicant.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://eplicant.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <noscript>
      <h1>Eplicant — Find Your Next Opportunity</h1>
      <p>Thousands of jobs from across the web, updated automatically. Search remote, full-time, and freelance opportunities worldwide.</p>
      <p>Please enable JavaScript to use this application.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
